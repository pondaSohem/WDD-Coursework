<!DOCTYPE html>
<html>
<head>
    <title>Splash Example</title>
    <link rel="stylesheet" href="splash.css">
    <style>
        #splash {
            transition: opacity 0.8s ease;
        }
        #splash.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash">
        <h1 class="logo"><bold>Quality Education</bold></h1>
        <br>
        <p id="para">Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen book.</p>
        <br>
        <a class="skipbutton" href="../StudentOne/home.html">skip</a>
        <h3 id="countdown">3</h3>
    </div>


    <script>
        let count = 3;
        const countdown = document.getElementById('countdown');
        const splash = document.getElementById('splash');

        function redirectWithFade() {
            clearInterval(timer);
            splash.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = '../StudentOne/home.html'; // Change this to your target page
            }, 800); // Matches the CSS transition duration
        }

        const timer = setInterval(() => {
            count--;
            countdown.textContent = count;

            if (count <= 0) {
                redirectWithFade();
            }
        }, 1000);

        document.querySelector('.skipbutton').addEventListener('click', (e) => {
            e.preventDefault();
            redirectWithFade();
        });
    </script>
</body>
</html>
