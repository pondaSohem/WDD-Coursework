    <link rel="stylesheet" href="../GlobalTemplate/template.css">
    <style>
        

.gallery-parent {
   display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    justify-content: center;
}

    /* Image card container */
.gallery-image-card {
    position: relative;
    display: inline-block;
    overflow: hidden;
    border-radius: 10px;
    text-decoration: none;
    margin: 0 5px;
}

/* Overlay text - hidden by default */
.overlay-text {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
    color: white;
    text-align: center;
    padding: 20px 10px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    font-size: 18px;
    font-weight: bold;
}

.overlay-text span {
    font-size: 14px;
    font-weight: normal;
    display: block;
    margin-top: 5px;
}

/* Show text on hover */
.gallery-image-card:hover .overlay-text {
    transform: translateY(0);
}

/* Image styling */
.gallery-image-card img {
    height: 380px;
    width: 380px;
    display: block;
    transition: transform 0.3s ease;
    object-fit: cover;
}

/* Zoom effect */
.gallery-image-card:hover img {
    transform: scale(1.04);
}





        
      
    </style>
</head>
